sentence=ESP-NOW mono-variable : un paquet = une variable, trame auto-descriptive avec horodatage et CRC-16.
paragraph=Un paquet transporte une seule variable identifiee par (id_iot, id_var), avec son type, son unite et sa longueur dans l'en-tete : le recepteur la decode sans partager le struct de l'emetteur. Ajouter une variable ne touche que son emetteur et ses abonnes. Le pied de trame porte epoch (UTC), uptime et numero de sequence, ce qui rend mesurables la fraicheur d'une mesure et la perte par emetteur. Remplace EspNowEchange (40 o) et struct_message_iOT_espnow (~90 o), deux structs monolithiques qui se rejetaient mutuellement. Header-only, zero allocation dynamique, ESP8266 et ESP32.
